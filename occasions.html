<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F0A1E">
  <title>Choose Occasion — Wishly</title>
  <meta name="description" content="Choose the perfect occasion for your personalised wish card.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <script>
    (function () {
      const saved = localStorage.getItem('wishly_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#F8FAFC' : '#0F0A1E');
    })();
  </script>
</head>
<body class="has-bottom-nav has-step-bar">

  <!-- ── Header ──────────────────────────────────────────── -->
  <header class="app-header">
    <a href="index.html" class="header-icon-btn me-1" aria-label="Back">
      <i class="bi bi-arrow-left"></i>
    </a>
    <span class="logo">Wishly ✨</span>
    <div class="header-actions">
      <button class="header-icon-btn" id="btnThemeToggle" aria-label="Toggle Night/Day Mode" title="Toggle Night/Day Mode">
        <i class="bi bi-sun-fill" style="color:var(--secondary)"></i>
      </button>
      <button class="header-icon-btn" id="btnHeaderSearch2" aria-label="Search">
        <i class="bi bi-search"></i>
      </button>
    </div>
  </header>

  <!-- ── Step Bar ─────────────────────────────────────────── -->
  <div class="step-bar">
    <button class="step-back-btn" aria-label="Go back">
      <i class="bi bi-chevron-left"></i>
    </button>
    <div class="step-info">
      <div class="step-label">Step 1 of 6</div>
      <div class="step-title">Choose Occasion</div>
    </div>
    <div class="step-progress-track">
      <div class="step-progress-fill" style="width:16.67%"></div>
    </div>
  </div>

  <!-- ── Main ─────────────────────────────────────────────── -->
  <main class="page-content with-step-bar">

    <!-- Search -->
    <div class="search-bar-wrap">
      <i class="bi bi-search search-icon"></i>
      <input type="search" class="search-bar" id="occasionSearch"
             placeholder="Search occasions..." autocomplete="off" aria-label="Search occasions">
    </div>

    <!-- Category Chips -->
    <div class="filter-chips" id="occasionCategoryChips" role="tablist" aria-label="Filter occasions by category">
      <!-- JS rendered -->
    </div>

    <div class="mt-3 mb-2 px-3">
      <p class="text-muted-custom small mb-0" id="occasionCount">26 occasions</p>
    </div>

    <!-- Occasions Grid -->
    <div class="occasion-grid" id="occasionsGrid" role="list" aria-label="Occasions">
      <!-- JS rendered -->
    </div>

    <!-- Empty state -->
    <div id="noOccasionResults" class="empty-state d-none">
      <div class="empty-state-icon">🔍</div>
      <div class="empty-state-title">No occasions found</div>
      <div class="empty-state-text">Try a different search term.</div>
    </div>

    <div style="height:2rem"></div>

  </main>

  <!-- ── Bottom Navigation ────────────────────────────────── -->
  <nav class="bottom-nav" role="navigation">
    <a href="index.html"     class="bottom-nav-item" data-page="index.html"><i class="bi bi-house"></i><span>Home</span></a>
    <a href="occasions.html" class="bottom-nav-item active" data-page="occasions.html"><i class="bi bi-grid-fill"></i><span>Explore</span></a>
    <a href="occasions.html" class="bottom-nav-item d-flex align-items-center justify-content-center" style="flex:0 0 auto">
      <div class="bottom-nav-create" aria-label="Create"><i class="bi bi-plus-lg"></i></div>
    </a>
    <a href="favorites.html" class="bottom-nav-item" data-page="favorites.html"><i class="bi bi-heart"></i><span>Favorites</span></a>
    <a href="occasions.html" class="bottom-nav-item"><i class="bi bi-search"></i><span>Search</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data/occasions.js"></script>
  <script src="assets/js/data/templates.js"></script>
  <script src="assets/js/data/wishes.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/protection.js"></script>
  <script>
  (function () {
    'use strict';

    // ── Render category chips ─────────────────────────────
    const chipsContainer = document.getElementById('occasionCategoryChips');
    OCCASION_CATEGORIES.forEach((cat, i) => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (i === 0 ? ' active' : '');
      chip.dataset.value = cat.id;
      chip.textContent = cat.label;
      chip.setAttribute('role', 'tab');
      chip.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
      chipsContainer.appendChild(chip);
    });

    // ── Render occasions ─────────────────────────────────
    let currentCategory = 'all';
    let currentQuery = '';

    function renderOccasions() {
      const grid = document.getElementById('occasionsGrid');
      const noResults = document.getElementById('noOccasionResults');
      const countEl = document.getElementById('occasionCount');
      if (!grid) return;

      let list = currentQuery
        ? searchOccasions(currentQuery)
        : getOccasionsByCategory(currentCategory);

      grid.innerHTML = '';

      if (!list.length) {
        noResults?.classList.remove('d-none');
        countEl && (countEl.textContent = '0 occasions');
        return;
      }

      noResults?.classList.add('d-none');
      countEl && (countEl.textContent = `${list.length} occasion${list.length !== 1 ? 's' : ''}`);

      list.forEach(occ => {
        const card = document.createElement('a');
        card.href = `templates.html?occasion=${occ.id}`;
        card.className = 'occasion-card';
        card.setAttribute('role', 'listitem');
        card.setAttribute('aria-label', `${occ.name} – ${occ.designCount} designs`);
        card.addEventListener('click', (e) => {
          e.preventDefault();
          selectOccasion(occ);
        });

        card.innerHTML = `
          <div class="occasion-icon-wrap" style="background:${occ.color}22;border:1px solid ${occ.color}44">
            <i class="bi ${occ.icon}" style="color:${occ.color}"></i>
          </div>
          <span class="occasion-name">${occ.name}</span>
          <span class="occasion-count">${occ.designCount} designs</span>
        `;
        grid.appendChild(card);
      });
    }

    function selectOccasion(occ) {
      AppState.update({ selectedOccasion: occ, currentStep: 1 });
      addRecentOccasion(occ.id);
      window.location.href = `templates.html?occasion=${occ.id}`;
    }

    // ── Search ────────────────────────────────────────────
    const searchInput = document.getElementById('occasionSearch');
    let searchTimer;
    searchInput?.addEventListener('input', function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        currentQuery = this.value.trim();
        renderOccasions();
      }, 250);
    });

    // ── Category chips ────────────────────────────────────
    chipsContainer?.addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      chipsContainer.querySelectorAll('.chip').forEach(c => {
        c.classList.remove('active');
        c.setAttribute('aria-selected', 'false');
      });
      chip.classList.add('active');
      chip.setAttribute('aria-selected', 'true');
      currentCategory = chip.dataset.value;
      currentQuery = '';
      if (searchInput) searchInput.value = '';
      renderOccasions();
    });

    // ── Step back button ──────────────────────────────────
    document.querySelector('.step-back-btn')?.addEventListener('click', () => history.back());

    // ── Header search button ──────────────────────────────
    document.getElementById('btnHeaderSearch2')?.addEventListener('click', () => {
      searchInput?.focus();
      searchInput?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // Initial render
    renderOccasions();
  })();
  </script>
</body>
</html>
