<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0F0A1E">
  <title>My Favorites — Wishly</title>
  <meta name="description" content="Your saved favorite card designs and wish messages on Wishly.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <script>
    (function () {
      const saved = localStorage.getItem('wishly_theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#F8FAFC' : '#0F0A1E');
    })();
  </script>
</head>
<body class="has-bottom-nav">

  <!-- ── Header ──────────────────────────────────────────── -->
  <header class="app-header">
    <a href="index.html" class="header-icon-btn me-1" aria-label="Back to Home"><i class="bi bi-arrow-left"></i></a>
    <span class="logo">Wishly ✨</span>
    <div class="header-actions">
      <button class="header-icon-btn" id="btnThemeToggle" aria-label="Toggle Night/Day Mode" title="Toggle Night/Day Mode">
        <i class="bi bi-sun-fill" style="color:var(--secondary)"></i>
      </button>
    </div>
  </header>

  <!-- ── Main ─────────────────────────────────────────────── -->
  <main class="page-content">
    <div class="px-3 pt-4 pb-2">
      <h1 style="font-size:1.4rem;font-weight:800;margin-bottom:.25rem">My Favorites ❤️</h1>
      <p class="text-muted-custom small mb-0">Your saved cards and messages.</p>
    </div>

    <!-- ── Tabs ──────────────────────────────────────────── -->
    <div class="filter-chips" id="favTabs">
      <button class="chip active" data-tab="templates">Card Designs</button>
      <button class="chip" data-tab="wishes">Messages</button>
    </div>

    <!-- Favorite Templates -->
    <div id="favTemplatesSection" class="mt-3">
      <div class="template-grid" id="favTemplateGrid" role="list">
      </div>
      <div id="noFavTemplates" class="empty-state d-none">
        <div class="empty-state-icon">❤️</div>
        <div class="empty-state-title">No favorite cards yet</div>
        <div class="empty-state-text">Tap the ❤️ on any card design to save it here.</div>
        <a href="occasions.html" class="btn-primary-custom mt-3">Explore Cards</a>
      </div>
    </div>

    <!-- Favorite Wishes -->
    <div id="favWishesSection" class="d-none mt-3">
      <div class="d-flex flex-column gap-2 px-3" id="favWishesList">
      </div>
      <div id="noFavWishes" class="empty-state d-none">
        <div class="empty-state-icon">✍️</div>
        <div class="empty-state-title">No favorite messages yet</div>
        <div class="empty-state-text">Tap the ❤️ on any wish message to save it here.</div>
        <a href="occasions.html" class="btn-primary-custom mt-3">Browse Messages</a>
      </div>
    </div>

    <div style="height:2rem"></div>
  </main>

  <!-- ── Bottom Navigation ─────────────────────────────────── -->
  <nav class="bottom-nav" role="navigation">
    <a href="index.html"     class="bottom-nav-item" data-page="index.html"><i class="bi bi-house"></i><span>Home</span></a>
    <a href="occasions.html" class="bottom-nav-item" data-page="occasions.html"><i class="bi bi-grid"></i><span>Explore</span></a>
    <a href="occasions.html" class="bottom-nav-item d-flex align-items-center justify-content-center" style="flex:0 0 auto">
      <div class="bottom-nav-create"><i class="bi bi-plus-lg"></i></div>
    </a>
    <a href="favorites.html" class="bottom-nav-item active" data-page="favorites.html"><i class="bi bi-heart-fill"></i><span>Favorites</span></a>
    <a href="occasions.html" class="bottom-nav-item"><i class="bi bi-search"></i><span>Search</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data/occasions.js"></script>
  <script src="assets/js/data/templates.js"></script>
  <script src="assets/js/data/wishes.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/protection.js"></script>
  <script>
  (function () {
    'use strict';

    let activeTab = 'templates';

    // ── Tab switching ─────────────────────────────────────
    document.getElementById('favTabs')?.addEventListener('click', e => {
      const chip = e.target.closest('.chip[data-tab]');
      if (!chip) return;
      document.querySelectorAll('#favTabs .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeTab = chip.dataset.tab;
      if (activeTab === 'templates') {
        document.getElementById('favTemplatesSection').classList.remove('d-none');
        document.getElementById('favWishesSection').classList.add('d-none');
      } else {
        document.getElementById('favTemplatesSection').classList.add('d-none');
        document.getElementById('favWishesSection').classList.remove('d-none');
        renderFavWishes();
      }
    });

    // ── Render favorite templates ─────────────────────────
    function renderFavTemplates() {
      const favIds = getFavoriteTemplateIds();
      const grid   = document.getElementById('favTemplateGrid');
      const empty  = document.getElementById('noFavTemplates');
      if (!grid) return;

      grid.innerHTML = '';

      if (!favIds.length) {
        empty?.classList.remove('d-none');
        return;
      }

      empty?.classList.add('d-none');

      favIds.forEach(tid => {
        const tmpl = getTemplateById(tid);
        if (!tmpl) return;

        const card = document.createElement('div');
        card.className = 'template-card';
        card.setAttribute('role', 'listitem');
        card.style.background = `linear-gradient(145deg, ${tmpl.gradient[0]}, ${tmpl.gradient[1]})`;

        card.innerHTML = `
          <button class="template-fav-btn active" data-tmpl="${tmpl.id}" aria-label="Remove from favorites">
            <i class="bi bi-heart-fill"></i>
          </button>
          <div class="template-canvas-preview">
            <div class="template-preview-emoji">${tmpl.emoji}</div>
            <div class="template-preview-text">${tmpl.occasionName}</div>
            <div class="template-preview-name">${tmpl.category}</div>
          </div>
          <div class="template-footer">
            <span class="template-name">${tmpl.name}</span>
            <button class="template-use-btn" data-tmpl="${tmpl.id}">Use this</button>
          </div>
        `;

        card.querySelector('.template-fav-btn').addEventListener('click', e => {
          e.stopPropagation();
          toggleFavoriteTemplate(tid);
          card.remove();
          showToast('Removed from favorites.', 'info');
          if (!document.querySelector('#favTemplateGrid .template-card')) {
            empty?.classList.remove('d-none');
          }
        });

        card.querySelector('.template-use-btn').addEventListener('click', e => {
          e.stopPropagation();
          const occ = getOccasionById(tmpl.occasionId);
          AppState.update({ selectedOccasion: occ, selectedTemplate: cloneTemplate(tid) });
          window.location.href = 'details.html';
        });

        card.addEventListener('click', e => {
          if (e.target.closest('.template-fav-btn') || e.target.closest('.template-use-btn')) return;
          const occ = getOccasionById(tmpl.occasionId);
          AppState.update({ selectedOccasion: occ, selectedTemplate: cloneTemplate(tid) });
          window.location.href = 'details.html';
        });

        grid.appendChild(card);
      });
    }

    // ── Render favorite wishes ─────────────────────────────
    function renderFavWishes() {
      const favIds  = getFavoriteWishIds();
      const list    = document.getElementById('favWishesList');
      const empty   = document.getElementById('noFavWishes');
      if (!list) return;

      list.innerHTML = '';

      if (!favIds.length) {
        empty?.classList.remove('d-none');
        return;
      }

      empty?.classList.add('d-none');

      // Search all occasions for these wish IDs
      favIds.forEach(wid => {
        let wish = null;
        for (const occId of Object.keys(WISHES)) {
          const found = WISHES[occId].find(w => w.id === wid);
          if (found) { wish = found; break; }
        }
        if (!wish) return;

        const card = document.createElement('div');
        card.className = 'wish-card';
        card.innerHTML = `
          <div class="d-flex align-items-start justify-content-between gap-2 mb-1">
            <span class="wish-category-badge">${wish.category}</span>
            <button class="template-fav-btn" style="position:static;width:30px;height:30px;font-size:.85rem;background:transparent;border:none;color:#F43F5E"
                    data-wish="${wish.id}" aria-label="Remove from favorites">
              <i class="bi bi-heart-fill"></i>
            </button>
          </div>
          <p class="wish-text">${wish.text}</p>
        `;

        card.querySelector('[data-wish]').addEventListener('click', () => {
          toggleFavoriteWish(wish.id);
          card.remove();
          showToast('Removed from favorites.', 'info');
          if (!document.querySelector('#favWishesList .wish-card')) {
            empty?.classList.remove('d-none');
          }
        });

        list.appendChild(card);
      });
    }

    // Initial render
    renderFavTemplates();
    initBottomNav();
  })();
  </script>
</body>
</html>
